<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b237a"><title>Royal Homes Finders</title><style>body{font-family:Arial;margin:0;background:#f5f4f8;color:#222}header{background:#4b237a;color:white;padding:20px}main{max-width:800px;margin:auto;padding:15px}.nav,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats{grid-template-columns:repeat(2,1fr)}button{padding:13px;border:0;border-radius:9px;background:#4b237a;color:#fff;font-weight:bold}button.secondary{background:#e6e0ed;color:#4b237a}.card,.stat{background:#fff;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0001}.stat b{display:block;font-size:24px;margin-top:5px}input,select,textarea{width:100%;padding:12px;margin:5px 0 12px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;font-size:16px}.paid{color:green;font-weight:bold}.unpaid{color:#b3261e;font-weight:bold}.hidden{display:none}.actions{display:flex;gap:7px;flex-wrap:wrap}</style></head><body><header><h2>ROYAL HOMES FINDERS</h2><div>House Hunting Management System</div></header><main><div class="nav"><button onclick="show('dash')">Dashboard</button><button onclick="show('add')">+ Add Client</button><button onclick="show('book')">Bookings</button></div><section id="dash"><div class="stats"><div class="stat">Total Clients<b id="total">0</b></div><div class="stat">Paid / Booked<b id="paid">0</b></div><div class="stat">Unpaid<b id="unpaid">0</b></div><div class="stat">Collected<b id="money">KSh 0</b></div></div><div class="card"><h3>Welcome</h3><p>Record house-hunting clients and track their fees.</p><button onclick="show('add')">Add New Booking</button></div></section><section id="add" class="hidden"><div class="card"><h3>New Client / Booking</h3><label>Client name<input id="name"></label><label>Phone number<input id="phone" type="tel"></label><label>Preferred location<input id="location"></label><label>House type<select id="house"><option>Bedsitter</option><option>Single room</option><option>1 Bedroom</option><option>2 Bedrooms</option><option>3 Bedrooms</option></select></label><label>Fee (KSh)<input id="fee" type="number" value="2000"></label><label>M-Pesa transaction code<input id="mpesa"></label><label>Viewing date<input id="viewing" type="date"></label><label>Notes<textarea id="notes"></textarea></label><label><input id="isPaid" type="checkbox" style="width:auto"> Payment received / booking confirmed</label><br><button onclick="saveClient()">Save Booking</button></div></section><section id="book" class="hidden"><div class="card"><h3>Bookings</h3><input id="search" placeholder="Search name or phone" oninput="render()"></div><div id="list"></div></section></main><script>let c=JSON.parse(localStorage.getItem('rhf')||'[]');const $=id=>document.getElementById(id);function money(n){return 'KSh '+Number(n||0).toLocaleString('en-KE')}function stats(){$('total').textContent=c.length;$('paid').textContent=c.filter(x=>x.paid).length;$('unpaid').textContent=c.filter(x=>!x.paid).length;$('money').textContent=money(c.filter(x=>x.paid).reduce((a,x)=>a+Number(x.fee),0))}function show(id){['dash','add','book'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='book')render();stats()}function saveClient(){let name=$('name').value.trim(),phone=$('phone').value.trim();if(!name||!phone)return alert('Enter client name and phone number.');c.unshift({id:Date.now(),name,phone,location:$('location').value,house:$('house').value,fee:Number($('fee').value)||0,mpesa:$('mpesa').value,viewing:$('viewing').value,notes:$('notes').value,paid:$('isPaid').checked});localStorage.setItem('rhf',JSON.stringify(c));alert('Booking saved.');show('book')}function render(){let q=($('search').value||'').toLowerCase();let d=c.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(q));$('list').innerHTML=d.length?d.map(x=>`<div class="card"><h3>${e(x.name)} <span class="${x.paid?'paid':'unpaid'}">${x.paid?'✓ PAID / BOOKED':'✗ UNPAID'}</span></h3><div>${e(x.phone)} • ${e(x.house)} • ${e(x.location)}</div><p>Fee: ${money(x.fee)}<br>${x.mpesa?'M-Pesa: '+e(x.mpesa)+'<br>':''}${x.viewing?'Viewing: '+e(x.viewing):''}</p><div class="actions"><button onclick="toggle(${x.id})">${x.paid?'Mark Unpaid':'Mark Paid'}</button><button class="secondary" onclick="location.href='tel:${x.phone}'">Call</button><button class="secondary" onclick="wa('${x.phone}')">WhatsApp</button><button onclick="del(${x.id})">Delete</button></div></div>`).join(''):'<div class="card">No bookings found.</div>'}function toggle(id){let x=c.find(x=>x.id===id);x.paid=!x.paid;localStorage.setItem('rhf',JSON.stringify(c));render();stats()}function del(id){if(confirm('Delete booking?')){c=c.filter(x=>x.id!==id);localStorage.setItem('rhf',JSON.stringify(c));render();stats()}}function wa(p){let n=p.replace(/\D/g,'');if(n.startsWith('0'))n='254'+n.slice(1);open('https://wa.me/'+n)}function e(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}stats();</script></body></html>
